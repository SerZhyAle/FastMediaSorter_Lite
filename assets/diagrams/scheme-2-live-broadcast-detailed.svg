<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#080d1a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="broadcasterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f97316" />
    </marker>
    <marker id="arrowCyan2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="1200" height="820" fill="url(#bgGrad)"/>

  <!-- Background Grid -->
  <g opacity="0.06" stroke="#f97316" stroke-width="1">
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="820" fill="url(#grid2)" />
  </g>

  <!-- Title & Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" fill="#f97316" font-size="12" font-weight="700" letter-spacing="2">СХЕМА 2 · ВЕЩАНИЕ И ТРАНСЛЯЦИИ (LIVE BROADCAST &amp; CAST)</text>
    <text x="0" y="28" fill="#f8fafc" font-size="22" font-weight="700">Трансляция с Windows ПК и мобильных устройств на все экраны</text>
    <text x="0" y="48" fill="#94a3b8" font-size="13">Захват экрана/звука на Windows, Fan-Out Relay сервер без задержек, Cast-координация на ТВ, телефоны и часы</text>
  </g>

  <!-- Connection Paths -->
  <!-- Windows Broadcaster to Exchange Relay -->
  <path d="M 330 250 C 420 250, 420 360, 470 380" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <!-- Android Broadcaster to Exchange Relay -->
  <path d="M 330 520 C 420 520, 420 440, 470 420" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>

  <!-- Relay to Smart TV -->
  <path d="M 730 360 C 780 340, 800 240, 870 230" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan2)"/>
  <!-- Relay to Android Phone Listener -->
  <path d="M 730 380 C 780 380, 810 370, 870 370" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan2)"/>
  <!-- Relay to Watch -->
  <path d="M 730 410 C 780 430, 810 500, 870 510" fill="none" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <!-- Relay to Windows Viewer Client -->
  <path d="M 730 440 C 780 480, 800 640, 870 650" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan2)"/>

  <!-- Direct LAN shortcut (dashed line) -->
  <path d="M 230 360 C 230 730, 750 780, 970 730" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="560" y="765" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Прямой поток в локальной сети (LAN Direct: без интернета, задержка &lt;50 мс)</text>

  <!-- ============================================================ -->
  <!-- LEFT: BROADCASTERS (ИСТОЧНИКИ ВЕЩАНИЯ) -->
  <!-- ============================================================ -->
  <rect x="40" y="125" width="310" height="605" rx="14" fill="#0f172a" opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="60" y="150" fill="#f97316" font-size="12" font-weight="700">ИСТОЧНИКИ ВЕЩАНИЯ (PRODUCERS)</text>
  <text x="60" y="166" fill="#64748b" font-size="10">Захват медиапотока в реальном времени</text>

  <!-- Node 1: Windows Workstation Broadcaster -->
  <g transform="translate(60, 185)" filter="url(#softShadow2)">
    <rect width="270" height="235" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.8"/>
    <rect width="270" height="28" rx="12" fill="url(#broadcasterGrad)"/>
    <text x="14" y="19" fill="#ffffff" font-size="12" font-weight="700">ПК Windows (Основной вещатель)</text>

    <!-- Specs -->
    <rect x="12" y="38" width="246" height="42" rx="6" fill="#0f172a"/>
    <text x="20" y="54" fill="#f8fafc" font-size="10" font-weight="600">🖥️ Захват экрана и окон приложений</text>
    <text x="20" y="68" fill="#94a3b8" font-size="9">Screen Capture API · Рабочий стол, игры, окна</text>

    <rect x="12" y="86" width="246" height="42" rx="6" fill="#0f172a"/>
    <text x="20" y="102" fill="#f8fafc" font-size="10" font-weight="600">🎙️ Захват системного звука + микрофон</text>
    <text x="20" y="116" fill="#94a3b8" font-size="9">WASAPI Loopback · Стерео Opus/AAC</text>

    <rect x="12" y="134" width="246" height="42" rx="6" fill="#0f172a"/>
    <text x="20" y="150" fill="#f8fafc" font-size="10" font-weight="600">⚙️ Кодировщик реального времени</text>
    <text x="20" y="164" fill="#fbbf24" font-size="9">MPEG-TS over HTTP · H.264 / AAC / Opus</text>

    <text x="14" y="195" fill="#f97316" font-size="9.5" font-weight="600">Восходящий поток (Upload Stream):</text>
    <text x="14" y="210" fill="#94a3b8" font-size="8.5">Бинарные чанки (1 flag byte + payload), keyframe 1s</text>
    <text x="14" y="222" fill="#64748b" font-size="8.5">Отправка в Fan-Out Relay по защищенному TLS</text>
  </g>

  <!-- Node 2: Android Phone Broadcaster -->
  <g transform="translate(60, 445)" filter="url(#softShadow2)">
    <rect width="270" height="155" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect width="270" height="28" rx="12" fill="#b45309" opacity="0.4"/>
    <text x="14" y="19" fill="#f8fafc" font-size="12" font-weight="700">Android Телефон (Мобильный эфир)</text>

    <text x="14" y="48" fill="#fbbf24" font-size="10" font-weight="600">📱 Камера, микрофон, трансляция экрана</text>
    <text x="14" y="64" fill="#94a3b8" font-size="9">Живая съемка фото/видео или стрим экрана</text>
    <text x="14" y="78" fill="#64748b" font-size="8.5">Прямой Upload в ретранслятор сервера обмена</text>

    <rect x="12" y="92" width="246" height="48" rx="6" fill="#0f172a"/>
    <text x="20" y="108" fill="#f8fafc" font-size="9.5" font-weight="600">Функция «Cast на устройство»:</text>
    <text x="20" y="122" fill="#38bdf8" font-size="8.5">Команда в 1 клик перенаправить трансляцию</text>
    <text x="20" y="132" fill="#34d399" font-size="8.5">на ТВ в гостиной или на рабочий монитор ПК</text>
  </g>

  <!-- ============================================================ -->
  <!-- CENTER: FAN-OUT RELAY & CAST ROUTER (СЕРВЕР РЕТРАНСЛЯЦИИ) -->
  <!-- ============================================================ -->
  <g transform="translate(470, 240)" filter="url(#softShadow2)">
    <rect width="260" height="340" rx="16" fill="url(#relayGrad)" stroke="#a855f7" stroke-width="2"/>
    <rect width="260" height="44" rx="16" fill="#4c1d95" />
    <rect width="260" height="16" y="28" fill="#4c1d95" />

    <text x="130" y="27" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">FAN-OUT RELAY &amp; CAST</text>
    <text x="130" y="60" fill="#c084fc" font-size="10.5" font-weight="600" text-anchor="middle">СЕРВЕР РЕТРАНСЛЯЦИИ ПОТОКОВ</text>
    <text x="130" y="76" fill="#94a3b8" font-size="9.5" text-anchor="middle">DEVICE-EXCHANGE Relay 0.17</text>

    <line x1="16" y1="88" x2="244" y2="88" stroke="#334155" stroke-width="1"/>

    <!-- Principle 1: 1 Upload -> N Listeners -->
    <rect x="14" y="98" width="232" height="52" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="116" fill="#f8fafc" font-size="10.5" font-weight="600">1 Загрузка ➔ Любое число зрителей</text>
    <text x="24" y="130" fill="#94a3b8" font-size="9">Broadcaster тратит трафик только 1 раз,</text>
    <text x="24" y="142" fill="#38bdf8" font-size="8.5">сервер размножает поток всем слушателям</text>

    <!-- Principle 2: Ring Buffer 2s -->
    <rect x="14" y="158" width="232" height="58" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="176" fill="#f8fafc" font-size="10.5" font-weight="600">Кольцевой буфер 2 сек (Ring Buffer)</text>
    <text x="24" y="190" fill="#94a3b8" font-size="9">Хранит только последние 2 с (лимит 8 МБ)</text>
    <text x="24" y="202" fill="#fbbf24" font-size="8.5">Контент не сохраняется на диск (Content-Agnostic)</text>

    <!-- Principle 3: Zero Delay Accumulation -->
    <rect x="14" y="224" width="232" height="50" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="242" fill="#f8fafc" font-size="10.5" font-weight="600">Никакого нарастания задержки!</text>
    <text x="24" y="256" fill="#94a3b8" font-size="9">Отставший слушатель пропускает кадры</text>
    <text x="24" y="266" fill="#34d399" font-size="8.5">и прыгает на живой край (Live Edge)</text>

    <!-- Principle 4: Cast Router -->
    <rect x="14" y="280" width="232" height="46" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="298" fill="#f8fafc" font-size="10.5" font-weight="600">Cast Маршрутизатор (cast-offer/answer)</text>
    <text x="24" y="312" fill="#c084fc" font-size="8.5">Маршрутизация предложений в рамках аккаунта</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT: LISTENERS & RECEIVERS (УСТРОЙСТВА-ПОЛУЧАТЕЛИ) -->
  <!-- ============================================================ -->
  <rect x="850" y="125" width="310" height="605" rx="14" fill="#0f172a" opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="870" y="150" fill="#38bdf8" font-size="12" font-weight="700">ПОЛУЧАТЕЛИ ТРАНСЛЯЦИИ (RECEIVERS)</text>
  <text x="870" y="166" fill="#64748b" font-size="10">Мгновенное воспроизведение на любом экране</text>

  <!-- Node 3: Smart TV 4K -->
  <g transform="translate(870, 185)" filter="url(#softShadow2)">
    <rect width="270" height="115" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="270" height="24" rx="10" fill="#0284c7" opacity="0.3"/>
    <text x="12" y="17" fill="#f8fafc" font-size="11" font-weight="700">📺 Smart TV (Большой экран)</text>

    <text x="12" y="42" fill="#38bdf8" font-size="10" font-weight="600">● Прием 4K / HD видео трансляции:</text>
    <text x="20" y="56" fill="#94a3b8" font-size="9">Воспроизведение рабочего стола или видео</text>
    <text x="20" y="68" fill="#64748b" font-size="8.5">MPEG-TS декодирование через встроенный плеер</text>
    <text x="12" y="88" fill="#34d399" font-size="9.5" font-weight="600">● Прием Cast-вызова с телефона или ПК</text>
    <text x="20" y="100" fill="#64748b" font-size="8.5">Автоматический запуск при cast-offer</text>
  </g>

  <!-- Node 4: Android Smartphone Receiver -->
  <g transform="translate(870, 315)" filter="url(#softShadow2)">
    <rect width="270" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="270" height="24" rx="10" fill="#0284c7" opacity="0.3"/>
    <text x="12" y="17" fill="#f8fafc" font-size="11" font-weight="700">📱 Android Смартфон (Приемник)</text>

    <text x="12" y="42" fill="#38bdf8" font-size="10" font-weight="600">● Просмотр живого эфира на ходу:</text>
    <text x="20" y="56" fill="#94a3b8" font-size="9">Минимальная буферизация, без задержек</text>
    <text x="20" y="68" fill="#64748b" font-size="8.5">Воспроизведение аудио и видео стримов</text>
    <text x="20" y="84" fill="#94a3b8" font-size="9">Мгновенный авто-реконнект при смене сети</text>
  </g>

  <!-- Node 5: Wear OS Watch Listener -->
  <g transform="translate(870, 440)" filter="url(#softShadow2)">
    <rect width="270" height="110" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="270" height="24" rx="10" fill="#6d28d9" opacity="0.3"/>
    <text x="12" y="17" fill="#f8fafc" font-size="11" font-weight="700">⌚ Android Часы (Wear OS)</text>

    <text x="12" y="42" fill="#c084fc" font-size="10" font-weight="600">● Аудиовещание на часы:</text>
    <text x="20" y="56" fill="#94a3b8" font-size="9">Прослушивание звука ПК/трансляции через часы</text>
    <text x="20" y="68" fill="#64748b" font-size="8.5">Легковесный HTTP/Opus поток (AUDIO_ONLY)</text>
    <text x="20" y="84" fill="#94a3b8" font-size="9">Уведомления о начале трансляции на ПК</text>
  </g>

  <!-- Node 6: Windows Viewer Receiver -->
  <g transform="translate(870, 565)" filter="url(#softShadow2)">
    <rect width="270" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="270" height="24" rx="10" fill="#1e40af" opacity="0.3"/>
    <text x="12" y="17" fill="#f8fafc" font-size="11" font-weight="700">💻 Windows Просмотрщик (Клиент)</text>

    <text x="12" y="42" fill="#38bdf8" font-size="10" font-weight="600">● Второй ПК как цель трансляции:</text>
    <text x="20" y="56" fill="#94a3b8" font-size="9">Принимает трансляцию с основного ПК или телефона</text>
    <text x="20" y="68" fill="#64748b" font-size="8.5">Оконный или полноэкранный режим показа</text>
    <text x="20" y="84" fill="#94a3b8" font-size="9">Синхронный звук и видеоряд без потерь</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 755)">
    <rect width="1080" height="35" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="22" fill="#f97316" font-size="10.5" font-weight="700">LIVE-BROADCAST:</text>
    <text x="150" y="22" fill="#cbd5e1" font-size="10">Один поток входа ➔ кольцевой буфер 2с ➔ неограниченная отдача слушателям без лагов</text>
    <text x="1060" y="22" fill="#64748b" font-size="10" text-anchor="end">Поддержка Cast между своими устройствами</text>
  </g>
</svg>
