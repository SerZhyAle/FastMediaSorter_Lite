<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0c0f1d; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="relayGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" fill="#f97316" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">УПРОЩЕННАЯ СХЕМА · ВЕЩАНИЕ И ТРАНСЛЯЦИИ (LIVE CAST)</text>
  <text x="500" y="75" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Трансляция экрана и звука со своего ПК на ТВ, смартфон и часы</text>

  <!-- Central Broadcast Hub -->
  <g transform="translate(370, 220)" filter="url(#shadow2)">
    <rect width="260" height="180" rx="24" fill="url(#relayGrad2)" stroke="#f97316" stroke-width="2"/>
    <circle cx="130" cy="65" r="30" fill="#ffffff" opacity="0.2"/>
    <!-- Antenna / Signal Icon -->
    <path d="M 118 78 L 142 78 M 130 78 L 130 52 M 122 58 A 12 12 0 0 1 138 58 M 116 52 A 18 18 0 0 1 144 52" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="130" y="115" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">РЕТРАНСЛЯТОР СЕРВЕРА</text>
    <text x="130" y="135" fill="#fed7aa" font-size="11" text-anchor="middle">Fan-Out Relay &amp; Cast</text>
    <text x="130" y="152" fill="#ffffff" font-size="10" opacity="0.9" text-anchor="middle">1 входящий поток ➔ всем устройствам</text>
    <text x="130" y="168" fill="#fef08a" font-size="9.5" text-anchor="middle">Задержка не накапливается!</text>
  </g>

  <!-- Connection lines -->
  <path d="M 230 250 L 370 290" fill="none" stroke="#f97316" stroke-width="3.5"/>
  <path d="M 230 430 L 370 330" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4"/>

  <path d="M 630 270 Q 700 210, 770 170" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 630 295 L 770 295" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 630 325 Q 700 370, 770 415" fill="none" stroke="#a855f7" stroke-width="3"/>
  <path d="M 630 350 Q 700 450, 770 520" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Left Broadcaster: Windows PC -->
  <g transform="translate(50, 190)" filter="url(#shadow2)">
    <rect width="180" height="130" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="90" y="32" fill="#f97316" font-size="12" font-weight="700" text-anchor="middle">🖥️ ПК Windows</text>
    <text x="90" y="55" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Вещает в реальном времени</text>
    <text x="90" y="78" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Захват экрана и окон</text>
    <text x="90" y="94" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Системный звук + микрофон</text>
    <text x="90" y="110" fill="#fbbf24" font-size="9" text-anchor="middle">MPEG-TS живой видеопоток</text>
  </g>

  <!-- Left Broadcaster: Android Phone -->
  <g transform="translate(50, 360)" filter="url(#shadow2)">
    <rect width="180" height="110" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="30" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">📱 Смартфон-Вещатель</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Камера или экран</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Прямой эфир с телефона</text>
    <text x="90" y="90" fill="#64748b" font-size="9" text-anchor="middle">Cast на телевизор в 1 клик</text>
  </g>

  <!-- Receivers Right Side -->
  <!-- Smart TV -->
  <g transform="translate(770, 120)" filter="url(#shadow2)">
    <rect width="180" height="100" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="30" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">📺 4K Smart TV</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Большой экран</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Трансляция видео и звука</text>
    <text x="90" y="88" fill="#64748b" font-size="8.5" text-anchor="middle">Автозапуск по вызову Cast</text>
  </g>

  <!-- Smartphone -->
  <g transform="translate(770, 245)" filter="url(#shadow2)">
    <rect width="180" height="100" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="30" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">📱 Android Смартфон</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Мобильный плеер</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Просмотр эфира без задержек</text>
    <text x="90" y="88" fill="#64748b" font-size="8.5" text-anchor="middle">Воспроизведение на ходу</text>
  </g>

  <!-- Wear OS Watch -->
  <g transform="translate(770, 370)" filter="url(#shadow2)">
    <rect width="180" height="100" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="90" y="30" fill="#a855f7" font-size="12" font-weight="700" text-anchor="middle">⌚ Android Часы</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Wear OS</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Звуковой стрим на часы</text>
    <text x="90" y="88" fill="#64748b" font-size="8.5" text-anchor="middle">Уведомления о начале эфира</text>
  </g>

  <!-- Second PC -->
  <g transform="translate(770, 495)" filter="url(#shadow2)">
    <rect width="180" height="100" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="30" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">💻 Второй ПК Windows</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Клиент просмотра</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Принимает стрим с другого ПК</text>
    <text x="90" y="88" fill="#64748b" font-size="8.5" text-anchor="middle">Полноэкранный просмотр</text>
  </g>

  <!-- Bottom note -->
  <text x="500" y="625" fill="#64748b" font-size="11" text-anchor="middle">Прямой просмотр в один клик: нажал Cast на телефоне или ПК — картинка сразу появилась на телевизоре</text>
</svg>
