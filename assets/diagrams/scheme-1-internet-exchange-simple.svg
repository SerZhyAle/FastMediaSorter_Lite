<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0b1120; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">УПРОЩЕННАЯ СХЕМА · РАБОТА ЧЕРЕЗ ИНТЕРНЕТ</text>
  <text x="500" y="75" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Общий доступ к медиа в любой точке мира через Сервер обмена</text>

  <!-- Central Cloud Hub -->
  <g transform="translate(370, 220)" filter="url(#shadow)">
    <rect width="260" height="180" rx="24" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="130" cy="65" r="34" fill="#ffffff" opacity="0.15"/>
    <path d="M 115 70 C 115 62, 122 55, 130 55 C 138 55, 144 61, 145 68 C 150 68, 154 72, 154 77 C 154 82, 150 86, 145 86 L 115 86 C 110 86, 106 82, 106 77 C 106 72, 110 68, 115 70 Z" fill="#ffffff"/>
    <text x="130" y="115" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">СЕРВЕР ОБМЕНА</text>
    <text x="130" y="135" fill="#bae6fd" font-size="11" text-anchor="middle">Белый IP · Логи пользователя</text>
    <text x="130" y="152" fill="#e0f2fe" font-size="10" opacity="0.9" text-anchor="middle">Связывает все устройства между собой</text>
  </g>

  <!-- Connection Lines -->
  <!-- Left PC to Cloud -->
  <path d="M 230 200 Q 300 240, 370 270" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Left Windows Server to Cloud -->
  <path d="M 230 420 Q 300 380, 370 350" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Cloud to Android Phone Client -->
  <path d="M 630 270 Q 700 230, 770 190" fill="none" stroke="#34d399" stroke-width="3"/>
  <!-- Cloud to Android Phone Server -->
  <path d="M 630 310 L 770 310" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Cloud to Smart TV -->
  <path d="M 630 350 Q 700 410, 770 450" fill="none" stroke="#34d399" stroke-width="3"/>
  <!-- Cloud to Watch -->
  <path d="M 500 400 L 500 490" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Node: Windows PC with SFTP -->
  <g transform="translate(60, 140)" filter="url(#shadow)">
    <rect width="180" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="32" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">🖥️ Домашний ПК</text>
    <text x="90" y="55" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">SFTP-сервер + Клиент</text>
    <text x="90" y="78" fill="#94a3b8" font-size="9.5" text-anchor="middle">Открытые папки с фото</text>
    <text x="90" y="94" fill="#64748b" font-size="9" text-anchor="middle">Доступен через интернет</text>
  </g>

  <!-- Node: Always-on Windows Server -->
  <g transform="translate(60, 360)" filter="url(#shadow)">
    <rect width="180" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="32" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">🗄️ Серверная редакция</text>
    <text x="90" y="55" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Служба Windows</text>
    <text x="90" y="78" fill="#94a3b8" font-size="9.5" text-anchor="middle">Работает круглосуточно</text>
    <text x="90" y="94" fill="#64748b" font-size="9" text-anchor="middle">Раздаёт файлы без входа</text>
  </g>

  <!-- Node: Android Phone Client -->
  <g transform="translate(760, 130)" filter="url(#shadow)">
    <rect width="180" height="110" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="90" y="30" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">📱 Android Телефон</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Клиент чтения</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Смотрит любые SFTP</text>
    <text x="90" y="90" fill="#64748b" font-size="9" text-anchor="middle">Скачивает и сортирует</text>
  </g>

  <!-- Node: Android Phone as SFTP Server -->
  <g transform="translate(760, 260)" filter="url(#shadow)">
    <rect width="180" height="110" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="30" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">📲 Телефон-Сервер</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Раздаёт свои файлы</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Открывает галерею/камеру</text>
    <text x="90" y="90" fill="#64748b" font-size="9" text-anchor="middle">для ПК и других телефонов</text>
  </g>

  <!-- Node: Android TV -->
  <g transform="translate(760, 390)" filter="url(#shadow)">
    <rect width="180" height="110" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="90" y="30" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">📺 Smart TV / Телевизор</text>
    <text x="90" y="52" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Большой экран</text>
    <text x="90" y="74" fill="#94a3b8" font-size="9.5" text-anchor="middle">Показ фото и видео</text>
    <text x="90" y="90" fill="#64748b" font-size="9" text-anchor="middle">через интернет из дома</text>
  </g>

  <!-- Node: Wear OS Watch -->
  <g transform="translate(410, 490)" filter="url(#shadow)">
    <rect width="180" height="100" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="90" y="28" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">⌚ Смарт-часы</text>
    <text x="90" y="48" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">Android Wear OS</text>
    <text x="90" y="70" fill="#94a3b8" font-size="9.5" text-anchor="middle">Аудиопотоки и контроль</text>
    <text x="90" y="85" fill="#64748b" font-size="9" text-anchor="middle">получатель медиа</text>
  </g>

  <!-- Bottom note -->
  <text x="500" y="620" fill="#64748b" font-size="11" text-anchor="middle">Все соединения зашифрованы · Никаких сторонних облачных хранилищ · Данные идут только между вашими устройствами</text>
</svg>
