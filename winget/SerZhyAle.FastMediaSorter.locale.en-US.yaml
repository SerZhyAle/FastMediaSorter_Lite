ShortDescription: Fast Media Sorter for Windows - keyboard-driven viewer and sorter for images and videos.
Description: |-
  Fast Media Sorter for Windows (published here as "FastMediaSorter LITE") is a fast, keyboard-driven
  viewer and sorter for images and video on Windows. Tick folders to browse, then move, copy, rename or
  delete files with single-key hotkeys - built for photographers and creators who triage large media
  folders quickly. It handles a wide range of formats (native H.264/MP4 with a LibVLC fallback for AVI,
  MKV, VP9 and more), slideshow and random modes, EXIF auto-rotate, an Ambilight-style background fill,
  and optional on-image OCR translation.
