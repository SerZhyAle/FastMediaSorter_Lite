name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v26.4.27.1200)'
        required: true

permissions:
  contents: write

# Сериализуем релизы по тегу. cancel-in-progress: false - публикацию релиза
# нельзя обрывать на середине (иначе полурелиз / битые ассеты).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest          # обязателен: MSBuild/.NET FW 4.8/WinForms/Inno/choco - на Linux не собрать
    timeout-minutes: 60              # страховка от зависания (choco / Invoke-WebRequest / ISCC)
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from tag
        id: ver
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { '${{ inputs.tag }}' }
          $version = $tag -replace '^v',''
          "tag=$tag"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag=$tag  Version=$version"

      - uses: microsoft/setup-msbuild@v3

      # .NET 10 SDK - required to build the Companion app (Share Manager,
      # src/FastMediaSorterCompanion, net10.0-windows). Without it the .sln build
      # (which now includes that project) fails and the Companion never ships.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: NuGet/setup-nuget@v4

      # Кэш NuGet-пакетов. Эффект небольшой (packages/ вендорится в репо),
      # но шаг дешёвый и страхует restore от обращений к сети.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.vbproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore NuGet packages
        run: nuget restore FastMediaSorter.sln

      # Build the whole solution (LITE net48 + Companion net10). The bare
      # FastMediaSorter.vbproj is old-style and only resolves its Release|AnyCPU
      # OutputPath through the .sln, so build the solution, not the project.
      # setup-dotnet (above) supplies the net10 SDK the Companion project needs.
      - name: Build Release
        run: msbuild FastMediaSorter.sln /p:Configuration=Release /p:Platform="Any CPU" /p:ReleaseVersion=${{ steps.ver.outputs.version }} /t:Rebuild /v:minimal /nologo

      # Companion app (Share Manager, net10) - self-contained single-file exe so
      # users without the .NET 10 runtime can still run it. Output goes to
      # companion-publish/FastMediaSorterCompanion.exe, staged below.
      - name: Publish Companion (Share Manager, net10 self-contained)
        run: dotnet publish src/FastMediaSorterCompanion/FastMediaSorterCompanion.vbproj -c Release -r win-x64 -o companion-publish -v minimal --nologo

      - name: Stage release files
        id: stage
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $stage = "stage/FastMediaSorter-$version-windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          function Get-RelativePath {
            param(
              [Parameter(Mandatory = $true)][string]$BasePath,
              [Parameter(Mandatory = $true)][string]$TargetPath
            )

            $baseResolved = (Resolve-Path $BasePath).Path.TrimEnd('\') + '\'
            $targetResolved = (Resolve-Path $TargetPath).Path
            $baseUri = New-Object System.Uri($baseResolved)
            $targetUri = New-Object System.Uri($targetResolved)
            [System.Uri]::UnescapeDataString($baseUri.MakeRelativeUri($targetUri).ToString().Replace('/', '\'))
          }

          $release = "bin/Release"
          if (-not (Test-Path $release)) { throw "Build output not found at $release" }
          $exe = Join-Path $release "FastMediaSorter_LITE.exe"
          if (-not (Test-Path $exe)) { throw "Release executable not found at $exe" }

          # Copy everything except debug/doc artefacts
          Get-ChildItem $release -Recurse -File |
            Where-Object { $_.Extension -notin '.pdb','.xml' } |
            ForEach-Object {
              $rel  = Get-RelativePath -BasePath $release -TargetPath $_.FullName
              $dest = Join-Path $stage $rel
              New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
              Copy-Item $_.FullName $dest
            }

          if (Test-Path README.md) { Copy-Item README.md $stage }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   $stage }

          # Android Folder Share payload: the Companion exe (published above) next
          # to the LITE exe, and the committed Go worker under companion\. Both are
          # picked up by the installer's `share` component and shipped in the ZIP.
          $companionExe = "companion-publish/FastMediaSorterCompanion.exe"
          if (-not (Test-Path $companionExe)) { throw "Companion exe not found at $companionExe (dotnet publish step failed?)" }
          Copy-Item $companionExe $stage

          $worker = "payload/companion/fms-share-worker.exe"
          if (-not (Test-Path $worker)) { throw "SFTP worker not found at $worker (should be committed in the repo)" }
          $stageCompanion = Join-Path $stage "companion"
          New-Item -ItemType Directory -Path $stageCompanion -Force | Out-Null
          Copy-Item "payload/companion/*" $stageCompanion -Recurse -Force

          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem $stage -Recurse | Format-Table -AutoSize

      # ГЛАВНАЯ ЭКОНОМИЯ: кэш скачанных tessdata-моделей (fast + best, 33 языка).
      # Восстанавливаем прямо в каталоги stage; скрипт ниже видит готовые файлы
      # ("Keeping existing model") и пропускает сотни МБ загрузок с GitHub.
      # Ключ привязан к языковому списку в скрипте - изменишь языки, кэш сам обновится.
      - name: Cache OCR tessdata
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.stage.outputs.stage }}/tessdata
            ${{ steps.stage.outputs.stage }}/tessdata-best
          key: tessdata-${{ hashFiles('tools/Prepare-OcrOfflinePayload.ps1') }}-v1

      - name: Add offline OCR payload
        run: .\tools\Prepare-OcrOfflinePayload.ps1 -StageDir '${{ steps.stage.outputs.stage }}' -IncludeBest
      
      - name: Show staged layout
        run: Get-ChildItem '${{ steps.stage.outputs.stage }}' -Recurse | Format-Table -AutoSize

      - name: Create zip + SHA256
        id: pkg
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $stage   = '${{ steps.stage.outputs.stage }}'
          $name    = "FastMediaSorter-$version-windows-x64.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipPath = "dist/$name"

          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash
          "$hash  $name" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii

          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Package: $name"
          Write-Host "SHA256:  $hash"

      # Кэшируем папку Chocolatey, чтобы не тянуть Inno Setup из сети каждый релиз.
      - name: Cache Chocolatey (Inno Setup)
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\lib
          key: choco-innosetup-v1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        id: setup
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $stage   = '${{ steps.stage.outputs.stage }}'
          $iscc    = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          $stageAbs = (Resolve-Path $stage).Path
          $distAbs  = (Resolve-Path dist).Path

          & $iscc "/DVersion=$version" "/DSourceDir=$stageAbs" "/O$distAbs" installer\FastMediaSorter.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }

          $setupName = "FastMediaSorter-$version-windows-x64-setup.exe"
          $setupPath = "dist/$setupName"
          if (-not (Test-Path $setupPath)) { throw "Installer not produced at $setupPath" }

          $hash = (Get-FileHash -Algorithm SHA256 $setupPath).Hash
          "$hash  $setupName" | Out-File -FilePath "$setupPath.sha256" -Encoding ascii

          "name=$setupName"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer: $setupName"
          Write-Host "SHA256:    $hash"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Fast Media Sorter for Windows ${{ steps.ver.outputs.version }}
          files: |
            dist/${{ steps.setup.outputs.name }}
            dist/${{ steps.setup.outputs.name }}.sha256
            dist/${{ steps.pkg.outputs.name }}
            dist/${{ steps.pkg.outputs.name }}.sha256
          body: |
            Fast Media Sorter for Windows ${{ steps.ver.outputs.version }}

            ## Install

            **Installer (recommended):** `${{ steps.setup.outputs.name }}`
            SHA256: `${{ steps.setup.outputs.sha256 }}`

            **Portable offline ZIP:** `${{ steps.pkg.outputs.name }}`
            SHA256: `${{ steps.pkg.outputs.sha256 }}`

            Both release assets bundle VLC runtimes and OCR language packs, so they are ready to launch offline after install/extract.

            OCR recognition works offline from the release package. Machine translation still depends on the provider you configure (for example a local Ollama install or an online API).

            **winget**:
            ```
            winget install --id SerZhyAle.FastMediaSorter
            ```

            The winget package uses the Inno Setup installer in silent per-user mode.
            The interactive setup can optionally register the app for common image formats.

            **Companion app for books/documents:**
            ```
            winget install SerZhyAle.DocHtmlTranslate
            ```
