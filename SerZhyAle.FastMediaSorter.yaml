ShortDescription: Fast media file sorter and organizer for Windows
Description: |
  FastMediaSorter is a lightweight Windows utility for quick sorting and 
  moving/copying image and video files to specified folders using hotkeys. 
  Perfect for photographers and content creators who need to organize 
  media files efficiently.
  
  Features:
  - Quick file sorting with keyboard shortcuts (1-0)
  - Support for images (JPG, PNG, GIF, BMP, etc.) and videos (MP4, MKV, etc.)
  - Slideshow and random file selection
  - Image rotation and transformation
  - Customizable color schemes and UI
  - Lightweight and fast
  - Multi-language support (English and Russian)

